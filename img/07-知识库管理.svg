<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
<rect width="960" height="600" fill="#0f1119"/>
<rect x="0" y="0" width="960" height="52" fill="#161822" rx="10"/><text x="24" y="33" fill="#818cf8" font-size="18" font-weight="bold" font-family="sans-serif">ScriptForge</text><text x="290" y="32" fill="#94a3b8" font-size="13" font-family="sans-serif" text-anchor="middle">首页</text><text x="370" y="32" fill="#94a3b8" font-size="13" font-family="sans-serif" text-anchor="middle">知识库</text><text x="450" y="32" fill="#94a3b8" font-size="13" font-family="sans-serif" text-anchor="middle">系统配置</text><rect x="40" y="76" width="440" height="480" rx="10" fill="#1a1d2b" stroke="#2a2d3d" stroke-width="1"/><text x="56" y="102" fill="#e2e8f0" font-size="14" font-weight="bold" font-family="sans-serif">知识库管理</text><line x1="56" y1="114" x2="464" y2="114" stroke="#2a2d3d" stroke-width="1"/><text x="56" y="118" fill="#94a3b8" font-size="12" font-family="sans-serif">已有 24 个人物条目</text><text x="56" y="145" fill="#94a3b8" font-size="11" font-family="sans-serif">搜索：</text><rect x="100" y="134" width="360" height="28" rx="6" fill="#0f1119" stroke="#2a2d3d" stroke-width="1"/><text x="112" y="152.0" fill="#64748b" font-size="11" font-family="sans-serif">搜索人物名称...</text><rect x="56" y="178" width="40" height="22" rx="4" fill="#6366f120" stroke="#6366f1" stroke-width="1"/><text x="64" y="193" fill="#6366f1" font-size="11" font-family="sans-serif">全部</text><rect x="100" y="178" width="40" height="22" rx="4" fill="#6366f120" stroke="#6366f1" stroke-width="1"/><text x="108" y="193" fill="#6366f1" font-size="11" font-family="sans-serif">原神</text><rect x="164" y="178" width="40" height="22" rx="4" fill="#94a3b820" stroke="#94a3b8" stroke-width="1"/><text x="172" y="193" fill="#94a3b8" font-size="11" font-family="sans-serif">崩铁</text><rect x="228" y="178" width="52" height="22" rx="4" fill="#94a3b820" stroke="#94a3b8" stroke-width="1"/><text x="236" y="193" fill="#94a3b8" font-size="11" font-family="sans-serif">绝区零</text><rect x="48" y="214" width="420" height="44" rx="6" fill="#6366f110" stroke="#2a2d3d" stroke-width="1"/><circle cx="72" cy="236" r="12" fill="#6366f120" stroke="#6366f1" stroke-width="1"/><text x="72" y="240" fill="#818cf8" font-size="10" font-family="sans-serif" text-anchor="middle">钟</text><text x="92" y="232" fill="#e2e8f0" font-size="12" font-family="sans-serif">钟离</text><text x="92" y="248" fill="#64748b" font-size="10" font-family="sans-serif">原神 · 往生堂客卿，岩之神</text><rect x="48" y="266" width="420" height="44" rx="6" fill="#1a1d2b" stroke="#2a2d3d" stroke-width="1"/><circle cx="72" cy="288" r="12" fill="#6366f120" stroke="#6366f1" stroke-width="1"/><text x="72" y="292" fill="#818cf8" font-size="10" font-family="sans-serif" text-anchor="middle">雷</text><text x="92" y="284" fill="#e2e8f0" font-size="12" font-family="sans-serif">雷电将军</text><text x="92" y="300" fill="#64748b" font-size="10" font-family="sans-serif">原神 · 稻妻统治者，雷之神</text><rect x="48" y="318" width="420" height="44" rx="6" fill="#1a1d2b" stroke="#2a2d3d" stroke-width="1"/><circle cx="72" cy="340" r="12" fill="#6366f120" stroke="#6366f1" stroke-width="1"/><text x="72" y="344" fill="#818cf8" font-size="10" font-family="sans-serif" text-anchor="middle">纳</text><text x="92" y="336" fill="#e2e8f0" font-size="12" font-family="sans-serif">纳西妲</text><text x="92" y="352" fill="#64748b" font-size="10" font-family="sans-serif">原神 · 须弥草神，智慧之神</text><rect x="48" y="370" width="420" height="44" rx="6" fill="#1a1d2b" stroke="#2a2d3d" stroke-width="1"/><circle cx="72" cy="392" r="12" fill="#6366f120" stroke="#6366f1" stroke-width="1"/><text x="72" y="396" fill="#818cf8" font-size="10" font-family="sans-serif" text-anchor="middle">胡</text><text x="92" y="388" fill="#e2e8f0" font-size="12" font-family="sans-serif">胡桃</text><text x="92" y="404" fill="#64748b" font-size="10" font-family="sans-serif">原神 · 往生堂堂主</text><rect x="48" y="422" width="420" height="44" rx="6" fill="#1a1d2b" stroke="#2a2d3d" stroke-width="1"/><circle cx="72" cy="444" r="12" fill="#6366f120" stroke="#6366f1" stroke-width="1"/><text x="72" y="448" fill="#818cf8" font-size="10" font-family="sans-serif" text-anchor="middle">三</text><text x="92" y="440" fill="#e2e8f0" font-size="12" font-family="sans-serif">三月七</text><text x="92" y="456" fill="#64748b" font-size="10" font-family="sans-serif">崩铁 · 星穹列车成员</text><rect x="48" y="474" width="420" height="44" rx="6" fill="#1a1d2b" stroke="#2a2d3d" stroke-width="1"/><circle cx="72" cy="496" r="12" fill="#6366f120" stroke="#6366f1" stroke-width="1"/><text x="72" y="500" fill="#818cf8" font-size="10" font-family="sans-serif" text-anchor="middle">丹</text><text x="92" y="492" fill="#e2e8f0" font-size="12" font-family="sans-serif">丹恒</text><text x="92" y="508" fill="#64748b" font-size="10" font-family="sans-serif">崩铁 · 星穹列车护卫</text><rect x="500" y="76" width="420" height="480" rx="10" fill="#1a1d2b" stroke="#2a2d3d" stroke-width="1"/><text x="516" y="102" fill="#e2e8f0" font-size="14" font-weight="bold" font-family="sans-serif">钟离</text><line x1="516" y1="114" x2="904" y2="114" stroke="#2a2d3d" stroke-width="1"/><rect x="860" y="78" width="48" height="34" rx="6" fill="#475569"/><text x="884.0" y="100" fill="white" font-size="13" font-family="sans-serif" text-anchor="middle">编辑</text><text x="516" y="125" fill="#94a3b8" font-size="12" font-family="sans-serif">游戏：原神</text><text x="516" y="148" fill="#94a3b8" font-size="12" font-family="sans-serif">身份：往生堂客卿 / 岩王帝君</text><text x="516" y="176" fill="#e2e8f0" font-size="12" font-family="sans-serif" font-weight="bold">性格特征</text><text x="516" y="200" fill="#94a3b8" font-size="11" font-family="sans-serif">沉稳、博学、优雅。说话慢条斯理，</text><text x="516" y="218" fill="#94a3b8" font-size="11" font-family="sans-serif">喜欢用契约和交易来比喻世间万物。</text><text x="516" y="248" fill="#e2e8f0" font-size="12" font-family="sans-serif" font-weight="bold">说话风格</text><text x="516" y="272" fill="#94a3b8" font-size="11" font-family="sans-serif">"契约既成，食言者当受食岩之罚。"</text><text x="516" y="292" fill="#94a3b8" font-size="11" font-family="sans-serif">"欲买桂花同载酒，终不似，少年游。"</text>
</svg>