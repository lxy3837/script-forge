amily="sans-serif" font-weight="bold">Agent</text><text x="72" y="316" fill="#e2e8f0" font-size="12" font-family="sans-serif">好的！什么样的故事风格？轻松日常向、战斗冒险向，还是偏感情向？</text><rect x="56" y="344" width="830" height="52" rx="8" fill="#22c55e10" stroke="#22c55e30" stroke-width="1"/><text x="72" y="362" fill="#22c55e" font-size="11" font-family="sans-serif" font-weight="bold">需求摘要已生成</text><text x="72" y="382" fill="#94a3b8" font-size="11" font-family="sans-serif">游戏：原神 | 主角：钟离、雷电将军 | 场景：璃月港 | 风格：轻松日常×感情线 | 篇幅：3-5章</text><rect x="56" y="416" width="700" height="40" rx="6" fill="#0f1119" stroke="#2a2d3d" stroke-width="1"/><text x="68" y="440.0" fill="#64748b" font-size="11" font-family="sans-serif">输入你的回答...</text><rect x="800" y="416" width="100" height="34" rx="6" fill="#6366f1"/><text x="850.0" y="438" fill="white" font-size="13" font-family="sans-serif" text-anchor="middle">发送 →</text>
