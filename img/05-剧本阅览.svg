<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
<rect width="960" height="600" fill="#0f1119"/>
<rect x="0" y="0" width="960" height="52" fill="#161822" rx="10"/><text x="24" y="33" fill="#818cf8" font-size="18" font-weight="bold" font-family="sans-serif">ScriptForge</text><text x="290" y="32" fill="#94a3b8" font-size="13" font-family="sans-serif" text-anchor="middle">首页</text><text x="370" y="32" fill="#94a3b8" font-size="13" font-family="sans-serif" text-anchor="middle">返回项目</text><text x="450" y="32" fill="#94a3b8" font-size="13" font-family="sans-serif" text-anchor="middle">知识库</text><text x="530" y="32" fill="#94a3b8" font-size="13" font-family="sans-serif" text-anchor="middle">系统配置</text><rect x="810" y="62" width="88" height="22" rx="4" fill="#6366f120" stroke="#6366f1" stroke-width="1"/><text x="818" y="77" fill="#6366f1" font-size="11" font-family="sans-serif">步骤 4/6</text><rect x="20" y="90" width="200" height="460" rx="10" fill="#1a1d2b" stroke="#2a2d3d" stroke-width="1"/><text x="36" y="118" fill="#e2e8f0" font-size="13" font-weight="bold" font-family="sans-serif">章节列表</text><line x1="36" y1="128" x2="204" y2="128" stroke="#2a2d3d" stroke-width="1"/><rect x="24" y="148" width="190" height="48" rx="6" fill="#6366f110" stroke="#6366f1" stroke-width="2"/><text x="40" y="168" fill="#818cf8" font-size="11" font-family="sans-serif" font-weight="bold">第1章</text><text x="40" y="186" fill="#e2e8f0" font-size="11" font-family="sans-serif">璃月重逢</text><rect x="24" y="204" width="190" height="48" rx="6" fill="#1a1d2b" stroke="none" stroke-width="0"/><text x="40" y="224" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="bold">第2章</text><text x="40" y="242" fill="#94a3b8" font-size="11" font-family="sans-serif">茶室对谈</text><rect x="24" y="260" width="190" height="48" rx="6" fill="#1a1d2b" stroke="none" stroke-width="0"/><text x="40" y="280" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="bold">第3章</text><text x="40" y="298" fill="#94a3b8" font-size="11" font-family="sans-serif">雷电之忆</text><rect x="24" y="316" width="190" height="48" rx="6" fill="#1a1d2b" stroke="none" stroke-width="0"/><text x="40" y="336" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="bold">第4章</text><text x="40" y="354" fill="#94a3b8" font-size="11" font-family="sans-serif">契约与永恒</text><rect x="24" y="372" width="190" height="48" rx="6" fill="#1a1d2b" stroke="none" stroke-width="0"/><text x="40" y="392" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="bold">第5章</text><text x="40" y="410" fill="#94a3b8" font-size="11" font-family="sans-serif">归途</text><rect x="240" y="90" width="700" height="460" rx="10" fill="#1a1d2b" stroke="#2a2d3d" stroke-width="1"/><rect x="810" y="94" width="64" height="22" rx="4" fill="#6366f120" stroke="#6366f1" stroke-width="1"/><text x="818" y="109" fill="#6366f1" font-size="11" font-family="sans-serif">导出剧本</text><text x="260" y="124" fill="#e2e8f0" font-size="15" font-weight="bold" font-family="sans-serif">第1章 · 璃月重逢</text><text x="260" y="160" fill="#e2e8f0" font-size="12" font-family="sans-serif" font-weight="bold">【场景】璃月港码头 · 黄昏</text><text x="260" y="182" fill="#94a3b8" font-size="11" font-family="sans-serif">夕阳将璃月港染成一片金色，商船缓缓靠岸。行人往来不绝，</text><text x="260" y="198" fill="#94a3b8" font-size="11" font-family="sans-serif">叫卖声与船工的号子交织在一起。</text><text x="260" y="230" fill="#e2e8f0" font-size="12" font-family="sans-serif" font-weight="bold">【角色】钟离 · 往生堂客卿</text><text x="260" y="250" fill="#22c55e" font-size="11" font-family="sans-serif">（立于码头边缘，手捧一杯清茶，目光深远地望向海面）</text><text x="260" y="268" fill="#94a3b8" font-size="11" font-family="sans-serif">"契约既成，食言者当受食岩之罚。可有些约定，纵跨千年..."</text><text x="260" y="300" fill="#e2e8f0" font-size="12" font-family="sans-serif" font-weight="bold">【动作】雷电将军由远处走近</text><text x="260" y="320" fill="#94a3b8" font-size="11" font-family="sans-serif">码头上的人流忽然安静了片刻。一位紫发女子缓步而来，</text><text x="260" y="338" fill="#94a3b8" font-size="11" font-family="sans-serif">她的目光扫过人群，最终落在钟离的背影上。</text><text x="260" y="370" fill="#ef4444" font-size="11" font-family="sans-serif">雷电将军："好久不见，摩拉克斯。"</text>
</svg>