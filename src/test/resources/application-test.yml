# 测试环境配置
spring:
  application:
    name: script-forge-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  thymeleaf:
    cache: false

deepseek:
  api:
    base-url: http://localhost:9999
  chat:
    model: deepseek-chat
    max-tokens: 4096
    temperature: 0.7
    timeout-seconds: 30
  embedding:
    model: deepseek-embed
    timeout-seconds: 30

vector-db:
  index-dir: ${java.io.tmpdir}/script-forge-test-vectors
  dimension: 128

app:
  export-dir: ${java.io.tmpdir}/script-forge-test-exports

jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD:}
